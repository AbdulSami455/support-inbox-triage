[project]
name = "support-inbox-triage"
version = "0.1.0"
description = "Support inbox triage: FastAPI + LangGraph + OpenRouter"
requires-python = ">=3.12"
# Runtime dependencies (also bundled for Cloudflare Python Workers by pywrangler)
dependencies = [
    "fastapi>=0.115",
    "itsdangerous>=2.2",
    "httpx>=0.28",
    "pydantic>=2.11",
    "langgraph>=0.4",
]

[dependency-groups]
dev = ["workers-py", "workers-runtime-sdk", "pytest>=8", "uvicorn>=0.34"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
